<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6efd"><title>Cài ERH M&E PM</title>
<script>
window.__PROMPT=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();window.__PROMPT=e;window.dispatchEvent(new Event("promptready"));
});
</script>
<link rel="manifest" href="./manifest-1.webmanifest?v=8">
<link rel="icon" href="./favicon.png?v=8">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:#f4f8fc;font-family:Arial;color:#0b3a73}
.card{width:min(94vw,430px);text-align:center;background:#fff;border:1px solid #dce5ee;border-radius:24px;padding:24px 20px;box-shadow:0 16px 38px rgba(15,23,42,.10)}
.logo{width:155px;height:155px;border-radius:32px} h1{font-size:20px;margin:18px 0 8px}
.status{padding:12px;border:1px solid #dce5ee;border-radius:13px;background:#f8fafc;color:#52657a;font-size:14px;margin:16px 0 12px;text-align:left}
button,a{display:block;width:100%;min-height:54px;border-radius:14px;padding:15px 12px;margin-top:10px;font-weight:800;font-size:16px;text-decoration:none}
#installBtn{border:0;background:#0d6efd;color:#fff;cursor:pointer} #installBtn:disabled{opacity:.6}
#openBtn{border:1px solid #0d6efd;background:#fff;color:#0d6efd} .small{font-size:12px;color:#7a8795;margin-top:12px}
</style></head>
<body><div class="card">
<img class="logo" src="./icon-512.png?v=8" alt="ERH">
<h1>ERH KỸ THUẬT KHỐI – M&E PM</h1>
<div id="status" class="status">Đang tạo bộ cài...</div>
<button id="installBtn" disabled>ĐANG CHUẨN BỊ...</button>
<a id="openBtn" href="#">MỞ ỨNG DỤNG</a>
<div class="small">Bộ cài #2</div>
</div>
<script src="./launcher-config.js?v=8"></script>
<script>
(async function(){
const btn=document.getElementById("installBtn"),st=document.getElementById("status");
const target=String((window.LAUNCHER_CONFIG||{}).TARGET_URL||"").trim();
document.getElementById("openBtn").href=target||"#";
let prompt=window.__PROMPT;

function ready(){
  prompt=window.__PROMPT||prompt;
  if(!prompt)return false;
  btn.disabled=false;
  btn.textContent="CÀI ĐẶT ICON";
  st.textContent="Sẵn sàng cài đặt.";
  return true;
}
window.addEventListener("promptready",ready);

if("serviceWorker" in navigator){
  try{
    await navigator.serviceWorker.register("./sw-v8.js?v=8",{scope:"./",updateViaCache:"none"});
    await navigator.serviceWorker.ready;
  }catch(e){}
}

ready();

setTimeout(()=>{
  if(ready())return;
  btn.disabled=false;
  btn.textContent="THỬ TẠO ICON MỚI";
  st.textContent="Chrome chưa mở hộp cài. Bấm THỬ TẠO ICON MỚI.";
},3500);

btn.addEventListener("click",async()=>{
  if(btn.textContent==="THỬ TẠO ICON MỚI"){
    location.replace("./install-2.html?fresh="+Date.now());
    return;
  }

  prompt=window.__PROMPT||prompt;
  if(!prompt){
    location.replace("./install-2.html?fresh="+Date.now());
    return;
  }

  const p=prompt;
  prompt=null;
  window.__PROMPT=null;

  try{
    await p.prompt();
    const c=await p.userChoice;
    if(c&&c.outcome==="accepted"){
      btn.disabled=true;
      st.textContent="Đã xác nhận cài đặt. Đang hoàn tất...";
      setTimeout(()=>{if(target)location.replace(target)},1800);
    }else{
      btn.disabled=false;
      btn.textContent="CÀI ĐẶT ICON";
      st.textContent="Bạn đã hủy cài đặt.";
    }
  }catch(e){
    location.replace("./install-2.html?fresh="+Date.now());
  }
});

window.addEventListener("appinstalled",()=>{
  st.textContent="Cài đặt thành công. Đang mở ERH...";
  setTimeout(()=>{if(target)location.replace(target)},600);
});
})();
</script></body></html>
