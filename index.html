<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6efd">
<title>Cài ERH M&E PM</title>
<script>
window.__ERH_INSTALL_PROMPT=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  window.__ERH_INSTALL_PROMPT=e;
  window.dispatchEvent(new Event("erhInstallReady"));
});
</script>
<link rel="manifest" href="./manifest-v6.webmanifest?v=6">
<link rel="icon" href="./icons/favicon.png?v=6">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:#f4f8fc;font-family:Arial,sans-serif;color:#0b3a73}
.card{width:min(94vw,430px);text-align:center}.logo{width:170px;height:170px;border-radius:34px;box-shadow:0 10px 30px rgba(0,70,160,.15)}
h1{font-size:20px;margin:18px 0 8px}.sub{font-size:14px;color:#617086;margin-bottom:16px}
.status{padding:11px;border-radius:12px;background:#fff;border:1px solid #dce5ee;color:#52657a;font-size:13px;margin-bottom:12px}
button,a{display:block;width:100%;min-height:54px;border-radius:14px;padding:15px 12px;margin-top:10px;font-weight:800;font-size:16px;text-decoration:none}
#installBtn{border:0;background:#0d6efd;color:#fff;cursor:pointer}#installBtn:disabled{opacity:.6}
#openBtn{border:1px solid #0d6efd;background:#fff;color:#0d6efd}.small{font-size:12px;color:#7a8795;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="./icons/icon-512.png?v=6" alt="ERH">
<h1>ERH KỸ THUẬT KHỐI – M&E PM</h1>
<div class="sub">Cài Icon ERH</div>
<div id="status" class="status">Đang kiểm tra khả năng cài đặt...</div>
<button id="installBtn" disabled>ĐANG KIỂM TRA...</button>
<a id="openBtn" href="#">MỞ ỨNG DỤNG</a>
<div class="small">V6 – không dùng cache giao diện cũ</div>
</div>
<script src="./launcher-config.js?v=6"></script>
<script>
(async function(){
  const btn=document.getElementById("installBtn");
  const st=document.getElementById("status");
  const target=String((window.LAUNCHER_CONFIG||{}).TARGET_URL||"").trim();
  document.getElementById("openBtn").href=target||"#";
  let prompt=window.__ERH_INSTALL_PROMPT;

  function setReady(){
    prompt=window.__ERH_INSTALL_PROMPT||prompt;
    if(!prompt)return false;
    btn.disabled=false;
    btn.textContent="CÀI ĐẶT ICON";
    st.textContent="Sẵn sàng cài đặt.";
    return true;
  }
  window.addEventListener("erhInstallReady",setReady);

  if("serviceWorker" in navigator){
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
      await navigator.serviceWorker.register("./sw-v6.js?v=6",{scope:"./",updateViaCache:"none"});
      await navigator.serviceWorker.ready;
    }catch(e){}
  }

  setReady();

  setTimeout(()=>{
    if(setReady())return;
    btn.disabled=false;
    btn.textContent="LÀM MỚI BỘ CÀI";
    st.textContent="Chrome chưa phát hộp cài. Bấm LÀM MỚI BỘ CÀI.";
  },3000);

  btn.addEventListener("click",async()=>{
    if(btn.textContent==="LÀM MỚI BỘ CÀI"){
      const u=new URL(location.href);
      u.searchParams.set("fresh",Date.now());
      location.replace(u.toString());
      return;
    }

    prompt=window.__ERH_INSTALL_PROMPT||prompt;
    if(!prompt){
      const u=new URL(location.href);
      u.searchParams.set("fresh",Date.now());
      location.replace(u.toString());
      return;
    }

    const p=prompt;
    prompt=null;
    window.__ERH_INSTALL_PROMPT=null;
    try{
      await p.prompt();
      const c=await p.userChoice;
      if(c&&c.outcome==="accepted"){
        btn.disabled=true;
        st.textContent="Đã xác nhận cài đặt. Đang mở ERH...";
        setTimeout(()=>{if(target)location.replace(target)},1800);
      }else{
        btn.disabled=false;
        btn.textContent="CÀI ĐẶT ICON";
        st.textContent="Bạn đã hủy cài đặt.";
      }
    }catch(e){
      btn.disabled=false;
      btn.textContent="LÀM MỚI BỘ CÀI";
      st.textContent="Cần làm mới bộ cài.";
    }
  });

  window.addEventListener("appinstalled",()=>{
    st.textContent="Cài đặt thành công. Đang mở ERH...";
    setTimeout(()=>{if(target)location.replace(target)},600);
  });
})();
</script>
</body></html>
