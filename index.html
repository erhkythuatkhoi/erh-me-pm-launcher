<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ERH M&E PM</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ERH M&E PM">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f4f8fc}
    body{display:flex;align-items:center;justify-content:center}
    .wrap{width:min(92vw,420px);text-align:center;padding:24px}
    .logo{width:180px;height:180px;border-radius:36px;box-shadow:0 10px 30px rgba(0,70,160,.15)}
    h1{font-size:20px;margin:18px 0 6px;color:#0b3a73}
    p{margin:0 0 18px;color:#536274;font-size:14px}
    button{width:100%;padding:14px 18px;border:0;border-radius:12px;background:#0d6efd;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
    .note{margin-top:14px;font-size:12px;color:#7a8795}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./icons/icon-512.png" alt="ERH M&E PM">
    <h1 id="appName">ERH KỸ THUẬT KHỐI – M&E PM</h1>
    <p>Launcher độc lập. Không thay đổi mã nguồn ERH.</p>
    <button id="openBtn">MỞ ỨNG DỤNG</button>
    <div class="note">Khi link thay đổi, chỉ sửa TARGET_URL trong launcher-config.js</div>
  </div>

  <script src="./launcher-config.js"></script>
  <script>
    const cfg = window.LAUNCHER_CONFIG || {};
    document.title = cfg.SHORT_NAME || "ERH M&E PM";
    document.getElementById("appName").textContent = cfg.APP_NAME || "ERH KỸ THUẬT KHỐI – M&E PM";

    function openTarget(){
      const url = (cfg.TARGET_URL || "").trim();
      if(!url){ alert("Chưa cấu hình TARGET_URL"); return; }
      window.location.href = url;
    }
    document.getElementById("openBtn").addEventListener("click", openTarget);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  </script>
</body>
</html>
