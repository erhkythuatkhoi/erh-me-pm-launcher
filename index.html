<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6efd">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ERH M&E PM">
<title>Cài ERH M&E PM</title>

<script>
window.__ERH_PROMPT=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();
  window.__ERH_PROMPT=e;
  window.dispatchEvent(new Event("erh-prompt-ready"));
});
</script>

<link rel="manifest" href="./manifest.webmanifest?v=9">
<link rel="icon" href="./favicon.png?v=9">

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:#f4f8fc;font-family:Arial,sans-serif;color:#0b3a73}
.card{width:min(94vw,430px);text-align:center;background:#fff;border:1px solid #dce5ee;border-radius:24px;padding:24px 20px;box-shadow:0 16px 38px rgba(15,23,42,.10)}
.logo{width:155px;height:155px;border-radius:32px}
h1{font-size:20px;margin:18px 0 8px}
.status{padding:12px;border:1px solid #dce5ee;border-radius:13px;background:#f8fafc;color:#52657a;font-size:14px;margin:16px 0 12px;text-align:left}
button,a{display:block;width:100%;min-height:54px;border-radius:14px;padding:15px 12px;margin-top:10px;font-weight:800;font-size:16px;text-decoration:none}
#installBtn{border:0;background:#0d6efd;color:#fff;cursor:pointer}
#installBtn:disabled{opacity:.6}
#openBtn{border:1px solid #0d6efd;background:#fff;color:#0d6efd}
.small{font-size:12px;color:#7a8795;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="./icon-512.png?v=9" alt="ERH">
<h1>ERH KỸ THUẬT KHỐI – M&E PM</h1>
<div id="status" class="status">Đang kích hoạt bộ cài...</div>
<button id="installBtn" disabled>ĐANG CHUẨN BỊ...</button>
<a id="openBtn" href="#">MỞ ỨNG DỤNG</a>
<div class="small">Bộ cài V9</div>
</div>

<script src="./launcher-config.js?v=9"></script>
<script>
(function(){
'use strict';

const btn=document.getElementById("installBtn");
const st=document.getElementById("status");
const target=String((window.LAUNCHER_CONFIG||{}).TARGET_URL||"").trim();
const params=new URLSearchParams(location.search);
document.getElementById("openBtn").href=target||"#";
let promptEvent=window.__ERH_PROMPT||null;
let done=false;

function activatePrompt(){
  if(window.__ERH_PROMPT) promptEvent=window.__ERH_PROMPT;
  if(!promptEvent) return false;
  btn.disabled=false;
  btn.textContent="CÀI ĐẶT ICON";
  st.textContent="Sẵn sàng cài đặt. Bấm CÀI ĐẶT ICON.";
  return true;
}

function finish(){
  if(done) return;
  done=true;
  btn.disabled=true;
  st.textContent="Đã cài Icon thành công. Đang mở ERH...";
  setTimeout(()=>{ if(target) location.replace(target); },800);
}

window.addEventListener("erh-prompt-ready",activatePrompt);
window.addEventListener("appinstalled",finish);

async function prepare(){
  if(!("serviceWorker" in navigator)){
    st.textContent="Trình duyệt không hỗ trợ PWA.";
    btn.disabled=false;
    btn.textContent="MỞ ỨNG DỤNG";
    return;
  }

  try{
    const reg=await navigator.serviceWorker.register("./sw.js?v=9",{
      scope:"./",
      updateViaCache:"none"
    });

    try{await reg.update();}catch(e){}

    if(reg.waiting){
      try{reg.waiting.postMessage({type:"SKIP_WAITING"});}catch(e){}
    }

    await Promise.race([
      navigator.serviceWorker.ready,
      new Promise(r=>setTimeout(r,5000))
    ]);

    // IMPORTANT: current page must be controlled before Chrome exposes install prompt.
    if(!navigator.serviceWorker.controller){
      if(params.get("_ctrl")!=="1"){
        params.set("_ctrl","1");
        params.set("_ts",Date.now());
        st.textContent="Đang kích hoạt bộ cài. Trang sẽ tự mở lại...";
        location.replace(location.pathname+"?"+params.toString());
        return;
      }
      st.textContent="Service Worker chưa kiểm soát trang. Bấm THỬ LẠI.";
      btn.disabled=false;
      btn.textContent="THỬ LẠI";
      return;
    }

    st.textContent="Bộ cài đã kích hoạt. Đang chờ Chrome...";
    activatePrompt();

  }catch(err){
    st.textContent="Không kích hoạt được bộ cài. Bấm THỬ LẠI.";
    btn.disabled=false;
    btn.textContent="THỬ LẠI";
  }
}

prepare();
activatePrompt();

setTimeout(()=>{
  if(promptEvent||done) return;

  // If Chrome shows Open in app, the PWA is likely already installed.
  const standalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone===true;

  if(standalone){
    st.textContent="Ứng dụng đã được cài. Đang mở ERH...";
    setTimeout(()=>{if(target)location.replace(target)},500);
    return;
  }

  btn.disabled=false;
  btn.textContent="KIỂM TRA LẠI";
  st.textContent="Chrome chưa phát hộp cài. Nếu thanh địa chỉ có “Mở trong ứng dụng”, ERH đã được cài trên máy.";
},6000);

btn.addEventListener("click",async()=>{
  if(btn.textContent==="THỬ LẠI"||btn.textContent==="KIỂM TRA LẠI"){
    const u=new URL(location.href);
    u.searchParams.set("_ctrl","1");
    u.searchParams.set("_ts",Date.now());
    location.replace(u.toString());
    return;
  }

  activatePrompt();
  if(!promptEvent){
    st.textContent="Chrome chưa cung cấp hộp cài.";
    return;
  }

  const p=promptEvent;
  promptEvent=null;
  window.__ERH_PROMPT=null;

  try{
    await p.prompt();
    const choice=await p.userChoice;

    if(choice&&choice.outcome==="accepted"){
      btn.disabled=true;
      st.textContent="Đã xác nhận cài đặt. Đang tạo Icon...";
      setTimeout(()=>{if(!done)finish()},2500);
    }else{
      btn.disabled=false;
      btn.textContent="CÀI ĐẶT ICON";
      st.textContent="Bạn đã hủy cài đặt.";
    }
  }catch(e){
    st.textContent="Không gọi được hộp cài. Bấm KIỂM TRA LẠI.";
    btn.disabled=false;
    btn.textContent="KIỂM TRA LẠI";
  }
});
})();
</script>
</body>
</html>
